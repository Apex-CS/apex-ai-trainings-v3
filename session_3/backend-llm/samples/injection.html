<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>OWASP Injection</title>
</head>
<body>
    <h1>Injection</h1>
    <p>Injection flaws occur when untrusted data is sent to an interpreter as part of a command or query.</p>
    <h2>Mitigations</h2>
    <ul>
        <li>Use parameterized queries and prepared statements.</li>
        <li>Validate and sanitize all user input.</li>
        <li>Apply least privilege to database accounts.</li>
    </ul>
</body>
</html>
