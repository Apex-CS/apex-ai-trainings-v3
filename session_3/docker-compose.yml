services:
  postgres:
    image: postgres:16-alpine
    container_name: owasp-postgres
    environment:
      POSTGRES_DB: owasp_ai
      POSTGRES_USER: owasp
      POSTGRES_PASSWORD: owasp
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:${POSTGRES_CONTAINER_PORT:-5432}"
    volumes:
      - postgres_data:/var/data/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01.init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U owasp -d owasp_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: owasp-qdrant
    ports:
      - "${QDRANT_HTTP_HOST_PORT:-6333}:${QDRANT_HTTP_CONTAINER_PORT:-6333}"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:${QDRANT_GRPC_CONTAINER_PORT:-6334}"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL","bash -c 'exec 3<>/dev/tcp/127.0.0.1/${QDRANT_HTTP_CONTAINER_PORT:-6333}'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  qdrant_data:

