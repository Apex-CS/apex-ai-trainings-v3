spring:
  application:
    name: release-integration-agent
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/workshop

# External MCP Server URLs
jira:
  mcp:
    server:
      url: http://localhost:9001

deployment:
  mcp:
    server:
      url: http://localhost:8084

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    com.workshop.mcp.module05: DEBUG
    io.modelcontextprotocol: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/workshop
jira:
  mcp:
    server:
      url: http://wiremock-jira:8080
deployment:
  mcp:
    server:
      url: http://mcp-server-secure:8084
