spring:
  application:
    name: workshop-mcp-client-demo
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      client:
        enabled: false   # We manage McpSyncClient manually in McpClientConfig

server:
  port: 8082

# Stdio transport: launches Module 01's JAR as a child process.
# The client communicates with the server over its stdin/stdout pipes.
# This is the same transport used by Claude Desktop and most MCP hosts.
mcp:
  server:
    jar-path: ../module-01-foundations/target/module-01-foundations-1.0.0-SNAPSHOT.jar

logging:
  level:
    root: INFO
    com.workshop.mcp.module02: DEBUG
    # Uncomment to see raw JSON-RPC messages exchanged over stdio:
    # io.modelcontextprotocol: DEBUG
